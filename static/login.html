<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiq.AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SVG icons -->
    <style>
      .icon { width: 18px; height: 18px; fill: currentColor; }
    </style>
    <!-- SimpleWebAuthn -->
    <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
    <style>
        :root {
            --bg-base: #0f1115;
            --glass-bg: rgba(20, 22, 28, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(0, 0, 0, 0.2);
            --input-border: rgba(255, 255, 255, 0.1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ambient Background */
        .warp-tunnel {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, var(--bg-base) 100%);
            z-index: -2;
        }
        
        #mouse-tracker {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: -1;
            transition: left 0.1s ease-out, top 0.1s ease-out;
        }

        .viewport {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            animation: blurEntry 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes blurEntry {
            0% { filter: blur(15px); opacity: 0; transform: scale(1.05); }
            100% { filter: blur(0px); opacity: 1; transform: scale(1); }
        }

        .screen {
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            position: absolute;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-40%);
        }

        /* Welcome Screen */
        .welcome-content {
            text-align: center;
            animation: slideFadeIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }
        
        @keyframes slideFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        h1 span {
            color: var(--primary);
            -webkit-text-fill-color: var(--primary);
        }
        
        .welcome-content p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        /* Auth Card (Glassmorphism) */
        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: float 6s ease-in-out infinite, slideFadeIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .auth-card h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* Form Inputs */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* Buttons */
        button {
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-continue {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        .btn-continue, .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-continue:hover, .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-passkey {
            background: #111;
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        .btn-passkey:hover {
            background: #222;
            border-color: rgba(255,255,255,0.3);
        }

        .btn-google {
            background: white;
            color: #333;
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .btn-google:hover {
            background: #f8f9fa;
            border-color: rgba(0,0,0,0.2);
        }

        /* Divider */
        .divider {
            position: relative;
            text-align: center;
            margin: 25px 0;
        }
        .divider::before {
            content: "";
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1px;
            background: var(--input-border);
            z-index: 1;
        }
        .divider span {
            position: relative;
            background: var(--bg-base);
            padding: 0 15px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 2;
            border-radius: 20px;
        }

        /* Error & Success Messages */
        .error-message, #successMessage {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.2);
            text-align: center;
        }
        
        #successMessage {
            background: rgba(5, 150, 105, 0.1);
            border: 1px solid rgba(5, 150, 105, 0.2);
        }

        .icon { width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>
    <div id="mouse-tracker"></div>
    <div id="warp-tunnel" class="warp-tunnel"></div>

    <div class="viewport" id="viewport">
        <!-- WELCOME SCREEN -->
        <div class="screen" id="welcome-screen">
            <div class="welcome-content">
                <h1>Sentiq<span>.AI</span></h1>
                <p>The intelligent workspace of the future.</p>
                <button class="btn-continue" id="continue-btn">Enter Workspace</button>
            </div>
        </div>

        <!-- LOGIN SCREEN -->
        <div class="screen hidden" id="login-screen">
            <div class="auth-card glass">
                <h2>Welcome Back</h2>
                <p>Sign in to your intelligent workspace.</p>
                
                <form id="loginForm" class="auth-form">
                    <div class="input-group">
                        <label for="username">Email address</label>
                        <input type="text" id="username" name="username" required autocomplete="username" placeholder="you@example.com">
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                    </div>
                    
                    <div id="errorMessage" class="error-message hidden" style="color: #dc2626; font-size: 13px;"></div>
                    <div id="successMessage" style="color: #059669; font-size: 13px;" class="hidden"></div>
                    
                    <div style="display: flex; gap: 12px; margin-top: 10px;">
                        <button type="submit" class="btn-primary" id="loginBtn" style="flex: 1;">Sign In</button>
                        <button type="button" class="btn-secondary" id="registerBtn" style="flex: 1;">Sign Up</button>
                    </div>

                    <div class="divider" style="margin-top: 20px;"><span>OR</span></div>

                    <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
                        <button type="button" class="btn-google" style="width: 100%;" onclick="window.location.href='/auth/google/login'">
                            <svg class="icon" viewBox="0 0 24 24" style="fill: currentColor; margin-right: 8px;">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                            </svg>
                            Continue with Google
                        </button>
                        <button type="button" class="btn-passkey" style="width: 100%;" onclick="passkeyLogin()">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C9.243 2 7 4.243 7 7v3H6c-1.103 0-2 .897-2 2v8c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-8c0-1.103-.897-2-2-2h-1V7c0-2.757-2.243-5-5-5zm-3 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V9zm3 8c-1.103 0-2-.897-2-2s.897-2 2-2 2 .897 2 2-.897 2-2 2z"/></svg>
                            Continue with Passkey
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        // Interactive Mouse Tracker
        const tracker = document.getElementById('mouse-tracker');
        document.addEventListener('mousemove', (e) => {
            tracker.style.left = e.clientX + 'px';
            tracker.style.top = e.clientY + 'px';
        });

        // Warp Animation logic
        const continueBtn = document.getElementById('continue-btn');
        const viewport = document.getElementById('viewport');
        const welcomeScreen = document.getElementById('welcome-screen');
        const loginScreen = document.getElementById('login-screen');

        continueBtn.addEventListener('click', () => {
            // 1. Zoom deep into the screen and fade body to black
            viewport.classList.add('warp-active');
            document.body.classList.add('warp-black');
            
            setTimeout(() => {
                // 2. Swap screens while invisible
                welcomeScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                
                // Position far back
                viewport.classList.remove('warp-active');
                viewport.classList.add('warp-done');
                
                // Force reflow
                void viewport.offsetWidth;
                
                // 3. Zoom into login screen and restore background
                viewport.classList.remove('warp-done');
                viewport.classList.add('warp-recover');
                document.body.classList.remove('warp-black');
                
                setTimeout(() => {
                    viewport.classList.remove('warp-recover');
                }, 1200);

            }, 800);
        });

        // Standard Login Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');
            
            btn.textContent = 'Signing in...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    const resData = await response.json();
                    errorMsg.textContent = resData.detail || 'Login failed';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });

        // Registration Logic
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const btn = document.getElementById('registerBtn');
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            
            if (!usernameInput.value || !passwordInput.value) {
                errorMsg.textContent = 'Please fill in both fields to sign up.';
                errorMsg.classList.remove('hidden');
                return;
            }
            
            btn.textContent = 'Signing up...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            
            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value
                    })
                });
                
                const resData = await response.json();
                
                if (response.ok) {
                    successMsg.textContent = resData.message;
                    successMsg.classList.remove('hidden');
                } else {
                    errorMsg.textContent = resData.detail || 'Registration failed';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.textContent = 'Sign Up';
                btn.disabled = false;
            }
        });

        // Passkey Implementation
        const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;

        // Call this when user wants to add a passkey from within the app
        async function passkeyRegister() {
            try {
                const res = await fetch('/auth/webauthn/register/options');
                if (!res.ok) throw new Error('Failed to get registration options');
                const options = await res.json();
                
                const attResp = await startRegistration(options);
                
                const verifyRes = await fetch('/auth/webauthn/register/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(attResp),
                });
                
                if (verifyRes.ok) {
                    alert('Passkey registered successfully!');
                } else {
                    const err = await verifyRes.json();
                    alert(`Passkey registration failed: ${err.detail}`);
                }
            } catch (error) {
                console.error(error);
                alert('Passkey registration error: ' + error.message);
            }
        }

        // Call this when user clicks "Continue with Passkey"
        async function passkeyLogin() {
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.classList.add('hidden');
            
            try {
                const res = await fetch('/auth/webauthn/login/options');
                if (!res.ok) throw new Error('Failed to get login options');
                const options = await res.json();
                const challenge_id = options.challenge_id;
                
                const asseResp = await startAuthentication(options);
                
                const verifyRes = await fetch('/auth/webauthn/login/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challenge_id: challenge_id,
                        data: asseResp
                    }),
                });
                
                if (verifyRes.ok) {
                    window.location.href = '/';
                } else {
                    const err = await verifyRes.json();
                    errorMsg.textContent = `Passkey login failed: ${err.detail}`;
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                if (error.name !== 'NotAllowedError') {
                    errorMsg.textContent = 'Passkey authentication failed or was cancelled.';
                    errorMsg.classList.remove('hidden');
                }
            }
        }
    </script>
</body>
</html>
